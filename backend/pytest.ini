[pytest]
# Configuración de pytest para Tesla Cotizador V3.0

# Directorio de tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personalizados
markers =
    slow: tests que toman más tiempo
    integration: tests de integración
    unit: tests unitarios
    requires_deps: tests que requieren dependencias pesadas (python-docx, etc.)

# Configuración de coverage
[coverage:run]
source = app/services/professional/generators
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
skip_empty = True
